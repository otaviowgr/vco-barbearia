# Testes rodam com H2 em memória (não precisam de MySQL).
spring.datasource.url=jdbc:h2:mem:vco-teste;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.jackson.deserialization.fail-on-null-for-primitives=false
vco.seed.ao-iniciar=true
vco.cors.origens=http://localhost:3000
