spring.application.name=barbearia-api
server.port=${PORT:8080}
# Ao desligar, termina as requisições em andamento e fecha o banco com calma.
server.shutdown=graceful

# ---------- Banco de dados (padrão: H2 em arquivo) ----------
# Não precisa instalar nada: o banco é criado automaticamente na primeira
# execução, no arquivo backend-barbearia/data/vco-barbearia.mv.db,
# e os dados continuam lá quando a API é reiniciada.
# Para usar MySQL, rode com o perfil "mysql" (veja application-mysql.properties).
# WRITE_DELAY=0: grava cada alteração no disco na hora (seguro mesmo se a janela for fechada).
spring.datasource.url=jdbc:h2:file:${vco.dados:${VCO_DADOS:./data}}/vco-barbearia;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 para ver as tabelas: http://localhost:8080/h2-console
#   O JDBC URL exato aparece no terminal quando a API termina de subir.  usuário: sa   senha: (vazia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# As tabelas são criadas/atualizadas a partir das entidades JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Campos booleanos/numéricos ausentes no JSON viram false/0 (em vez de erro).
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ---------- Aplicação ----------
# Popula o banco com os dados da demonstração se ele estiver vazio.
vco.seed.ao-iniciar=true
# Origens liberadas no CORS (front-end Next.js).
vco.cors.origens=http://localhost:3000,http://127.0.0.1:3000,http://192.168.*.*:3000,http://10.*.*.*:3000

# ---------- Documentação ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
