spring.application.name=barbearia-api
server.port=${PORT:8080}

# ---------- Banco de dados (MySQL) ----------
# Padrão: MySQL local. Ajuste com variáveis de ambiente:
#   DB_HOST (localhost), DB_PORT (3306), DB_NAME (vco_barbearia), DB_USER (root), DB_PASSWORD (vazio)
# O banco é criado automaticamente se não existir.
# Sem MySQL? Rode com o perfil "dev" para usar H2 em memória.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vco_barbearia}?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# As tabelas são criadas/atualizadas a partir das entidades JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Campos booleanos/numéricos ausentes no JSON viram false/0 (em vez de erro).
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ---------- Aplicação ----------
# Popula o banco com os dados da demonstração se ele estiver vazio.
vco.seed.ao-iniciar=true
# Origens liberadas no CORS (front-end Next.js).
vco.cors.origens=http://localhost:3000,http://127.0.0.1:3000,http://192.168.*.*:3000,http://10.*.*.*:3000

# ---------- Documentação ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
