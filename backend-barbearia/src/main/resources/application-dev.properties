# Perfil "dev": banco H2 em memória (não precisa instalar MySQL).
# Rodar: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:mem:vco;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Console do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:vco)
spring.h2.console.enabled=true
