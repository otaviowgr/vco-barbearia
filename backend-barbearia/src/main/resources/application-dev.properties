# Perfil "dev": H2 só em memória. Os dados somem ao desligar a API
# (útil para testar com tudo zerado a cada execução).
# Rodar: mvnw spring-boot:run "-Dspring-boot.run.profiles=dev"
spring.datasource.url=jdbc:h2:mem:vco;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
